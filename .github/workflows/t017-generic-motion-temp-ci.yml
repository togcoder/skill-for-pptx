name: t017-generic-motion-temp-ci
on:
  push:
    branches:
      - work/T017-generic-report-motion-20261005
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml
      - run: python -m py_compile scripts/*.py
      - run: python -m unittest discover -s tests -v
