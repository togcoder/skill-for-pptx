<text x="70" y="540" font-family="Arial" font-size="17" fill="#44546A">Luồng suy luận: cửa sổ trượt 64 bước, 12 kênh cảm biến; encoder nén xuống 24 chiều.</text>
<text x="70" y="566" font-family="Arial" font-size="17" fill="#44546A">Điểm bất thường = hợp nhất sai số tái tạo và khoảng cách Mahalanobis; ngưỡng hiệu chỉnh trên tập validation.</text>
<text x="70" y="592" font-family="Arial" font-size="17" fill="#44546A">QAT: lượng tử hóa int8 trong huấn luyện; đầu ra TFLite Micro chạy trên STM32H747 / ESP32-S3.</text>
<line x1="40" y1="640" x2="1440" y2="640" stroke="#D6DEE8"/>
<text x="40" y="672" font-family="Arial" font-size="15" fill="#7F7F7F">Nguồn: tác giả thiết kế cho T052; hình vector do VectorCraft kết xuất.</text>
